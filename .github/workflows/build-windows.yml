name: Build Windows application

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip

      - name: Install application and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build standalone Windows application
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onedir
          --name=LicensePlateAnnotationTool
          --icon=assets/app-icon.ico
          --paths=src
          --hidden-import=hazen_license_plate_annotation_tool.app
          --collect-all=streamlit
          --collect-all=fast_alpr
          --collect-all=onnxruntime
          --copy-metadata=streamlit
          --copy-metadata=fast-alpr
          desktop_launcher.py

      - name: Upload Windows application
        uses: actions/upload-artifact@v7
        with:
          name: LicensePlateAnnotationTool-Windows-x64
          path: dist/LicensePlateAnnotationTool/
          if-no-files-found: error
          retention-days: 30
