name: Build Windows application

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip

      - name: Install application and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install nuitka ordered-set zstandard

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build standalone Windows application
        run: >
          python -m nuitka desktop_launcher.py
          --mode=standalone
          --mingw64
          --assume-yes-for-downloads
          --output-dir=build/nuitka
          --output-filename=LicensePlateAnnotationTool.exe
          --include-package=streamlit
          --include-package-data=streamlit
          --include-package=fast_alpr
          --include-package-data=fast_alpr
          --include-package=onnxruntime
          --include-package-data=onnxruntime
          --include-package=hazen_license_plate_annotation_tool
          --include-distribution-metadata=streamlit
          --include-distribution-metadata=fast-alpr
          --windows-icon-from-ico=assets/app-icon.ico
          --windows-console-mode=force
          --company-name="License Plate Annotation Tool"
          --product-name="License Plate Annotation Tool"
          --file-version=0.1.3.0
          --product-version=0.1.3.0

      - name: Upload Windows application
        uses: actions/upload-artifact@v7
        with:
          name: LicensePlateAnnotationTool-Windows-x64
          path: build/nuitka/desktop_launcher.dist/
          if-no-files-found: error
          retention-days: 30
